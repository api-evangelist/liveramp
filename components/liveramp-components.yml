note: >-
  LiveRamp ships no embeddable UI component library (no web components, no element library, no
  embedded dashboard). What it does ship on the client side is the Authenticated Traffic Solution
  (ATS) family — a browser script and mobile SDKs that publishers embed to turn an authenticated
  user into a RampID envelope. Recorded here because it is genuinely client-side, distinct from
  the server-side SDKs in packages/.
families:
