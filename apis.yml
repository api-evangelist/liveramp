- aid: liveramp:activation-api
  name: LiveRamp Activation API
  description: >-
    Programmatic activation of first-party and marketplace data across destination partners and
    connected platforms in the LiveRamp network. Manages destinations, destination integrations,
    integration connections, distribution managers, segment configurations, deliveries, segments
    and the OAuth authorization flow customers use to connect a destination platform. 26
    operations, OpenAPI 3.0.1 version 2.9.0, generated by LiveRamp's own open-source Reslang tool.
  humanURL: https://developers.liveramp.com/activation-api
  baseURL: https://api.liveramp.com/activation
