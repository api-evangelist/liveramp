- aid: liveramp:ats-api
  name: LiveRamp Authenticated Traffic Solution (ATS) API
  description: >-
    Privacy-first, PII-based authentication API enabling programmatic addressability without
    third-party cookies via RampID envelopes. Publishes no OpenAPI. LiveRamp has deprecated the
    ATS Mobile SDK with a target sunset of 2026-09-30 and directs mobile publishers to call this
    API directly instead.
  humanURL: https://developers.liveramp.com/authenticatedtraffic-api
