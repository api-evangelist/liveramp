apis:
- aid: liveramp:ats-api
  name: LiveRamp Authenticated Traffic Solution (ATS) API
  description: >-
    Privacy-first, PII-based authentication API enabling programmatic addressability without third-party
    cookies via RampID envelopes. Publishes no OpenAPI. LiveRamp has deprecated the ATS Mobile SDK with
    a target sunset of 2026-09-30 and directs mobile publishers to call this API directly instead.
  humanURL: https://developers.liveramp.com/authenticatedtraffic-api
  baseURL: https://api.rlcdn.com/api/identity/v2
  tags:
  - Identity
  - Privacy
  - Authentication
  properties:
  - type: Documentation
    url: https://developers.liveramp.com/authenticatedtraffic-api
  - type: LLMsTxt
    url: https://developers.liveramp.com/authenticatedtraffic-api/llms.txt
- aid: liveramp:abilitec-api
  name: LiveRamp AbiliTec API
  description: >-
    Identity resolution API that resolves offline PII data into stable AbiliTec links for enterprise customer-database
    unification, via a Match endpoint (plaintext PII) and a Lookup endpoint (hashed input). Publishes
    real rate limits — 10,000 records per minute per endpoint, 360 batch calls per minute at up to 1,000
    records each — but no OpenAPI.
  humanURL: https://developers.liveramp.com/abilitec-api
  baseURL: https://us.identity.api.liveramp.com/v1
  tags:
  - Identity
  - Resolution
  - PII
  properties:
  - type: Documentation
    url: https://developers.liveramp.com/abilitec-api
  - type: APIReference
