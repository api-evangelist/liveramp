summary: >-
  LiveRamp publishes no self-serve sandbox, no test-mode key prefix, and no magic test values.
  There is exactly one non-production surface named in any published artifact: a staging server
  declared in the Privacy API OpenAPI. Everything else is "your LiveRamp representative will
  provision a Service Account you can use to test API calls" — a sales-gated test path, not a
  sandbox.
sandbox_available: false
self_serve: false
environments:
- name: Privacy API production
  url: https://privacy-api.liveramp.com
  type: production
  source: openapi/liveramp-privacy-api-openapi.yml
- name: Privacy API staging
  url: https://privacy-api.staging.liveramp.com
  type: staging
  source: openapi/liveramp-privacy-api-openapi.yml
  note: >-
    Declared as "Staging environment" in the published Privacy API OpenAPI servers[] block. No
    documentation page explains how to obtain staging credentials, so it is recorded as a
    declared environment rather than an open sandbox.
- name: Activation API production
  url: https://api.liveramp.com/activation
  type: production
  source: openapi/liveramp-activation-api-openapi.yml
- name: Clean Room API production
  url: https://api.habu.com/v1/
  type: production
