- aid: liveramp:privacy-api
  name: LiveRamp Privacy API
  description: >-
    Automates data subject requests including opt-outs, deletions and consent updates across the
    LiveRamp ecosystem. Two operations, and the only endpoint in the LiveRamp portfolio with a
    documented idempotency contract — a duplicate create returns the original request_uuid with
    is_duplicate true. Supports mobile advertising IDs as of March 2026.
  humanURL: https://developers.liveramp.com/privacy-api
  baseURL: https://privacy-api.liveramp.com
