aid: liveramp
name: LiveRamp
description: LiveRamp is a data collaboration platform that lets enterprises connect, control,
  and activate first-party customer data across the digital ecosystem without moving raw PII
  between parties. Its developer surface spans identity resolution (AbiliTec links and RampID),
  programmatic activation to more than 500 destination platforms, privacy-safe clean-room
  collaboration on the former Habu platform, data marketplace buying and selling, Safe Haven
  analytics job automation, cookieless authenticated addressability through ATS, and a Privacy
  API for data-subject requests. LiveRamp publishes downloadable OpenAPI specifications for the
  Activation, Clean Room and Privacy APIs, an RFC 9727 API catalog, and an llms.txt index across
  ten developer sub-sites; API credentials are issued as Service Accounts by a LiveRamp
  representative rather than through self-serve signup.
