test_credentials:
  model: representative-provisioned
  detail: >-
    "When the necessary agreements are in place, your LiveRamp Representative will provide you
    with your Service Account (API key) and SFTP server credentials. You can use them to test API
    calls." There is no separate test key, no key prefix distinguishing test from live, and no
    documented way to obtain credentials without a LiveRamp representative.
  source: https://developers.liveramp.com/activation-api/reference/getting-started-1
test_values: []
test_values_note: >-
  No test cards, magic identifiers, sample RampIDs, seeded fixtures, or time-simulation tooling
  are published anywhere in the developer portal. Nothing is invented here.
