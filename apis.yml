- aid: liveramp:clean-room-api
  name: LiveRamp Clean Room API
  description: >-
    API for setting up and managing clean rooms, partners, data connections, datasets, questions,
    question runs, flows, exports and destinations for privacy-safe collaborative analytics. This
    is the former Habu platform — LiveRamp acquired Habu, and the specification's own contact
    block reads "LiveRamp (previously Habu)" with servers[] on api.habu.com. 151 operations and
    294 schemas — the largest machine-readable contract LiveRamp publishes.
