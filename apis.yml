- aid: liveramp:abilitec-api
  name: LiveRamp AbiliTec API
  description: >-
    Identity resolution API that resolves offline PII data into stable AbiliTec links for
    enterprise customer-database unification, via a Match endpoint (plaintext PII) and a Lookup
    endpoint (hashed input). Publishes real rate limits — 10,000 records per minute per endpoint,
    360 batch calls per minute at up to 1,000 records each — but no OpenAPI.
  humanURL: https://developers.liveramp.com/abilitec-api
  baseURL: https://us.identity.api.liveramp.com/v1
  tags:
  - Identity
  - Resolution
  - PII
