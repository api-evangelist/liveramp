  kind: script-tag library
  loader: https://ats.rlcdn.com/ats.js
  global: window.ats
  install: <script src="https://ats.rlcdn.com/ats.js"></script>
  versioning: unpinned
  http_status: 200
  note: >-
    Loaded from LiveRamp's own rlcdn.com CDN. The URL carries no version, so the build a publisher
    receives can change underneath them without notice; there is no package-registry metadata
    endpoint to pin against.
  configured_via: an ATS Placement created in the LiveRamp Console
  docs: https://developers.liveramp.com/authenticatedtraffic-api/
