dating_note: >-
  LiveRamp's per-entry changelog pages do not render a publication date in their markdown export,
  and the only machine-readable timestamp on the HTML page (`createdAt`) is the ReadMe CATEGORY
  creation date shared by every entry in that API — so it is NOT the entry date and is not
  recorded as one. Real per-entry dates exist only where LiveRamp writes them into the body,
  which the Privacy API changelog does. Undated entries are recorded as dated: false rather than
  given a fabricated date.
