        destination.


        OUT_OF_SYNC: The Taxonomy::Segment has been synced to the destination
        and the destinationSegmentID exists, but the properties have been
        updated and need to be resynced.


        SYNCED: The Taxonomy::Segment is in sync with the destination.
      enum:
        - NOT_CONFIGURED_TO_SYNC
        - NEVER_SYNCED
        - OUT_OF_SYNC
        - SYNCED
