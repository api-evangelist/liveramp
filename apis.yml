    url: https://developers.liveramp.com/abilitec-api/reference/rate-limits
  - type: LLMsTxt
    url: https://developers.liveramp.com/abilitec-api/llms.txt
- aid: liveramp:rampid-api
  name: LiveRamp RampID API
  description: >-
    API for matching data to the LiveRamp Identity Graph, including identity envelope creation and decryption,
    RampID transcoding between pseudonymous identifiers, and batch match/lookup calls returning data bundles.
    Publishes a documented error-code registry but no OpenAPI.
  humanURL: https://developers.liveramp.com/rampid-api
  baseURL: https://us.identity.api.liveramp.com/v1
  tags:
