components:
  parameters: {}
  schemas:
    v2DeliveryOutput:
      type: object
      properties:
        id:
          type: string
        status:
          allOf:
            - $ref: '#/components/schemas/DeliveryStatus'
          type: string
        deviceType:
          allOf:
            - $ref: '#/components/schemas/DeviceType'
          type: string
        recordCount:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: ISO8601 UTC date-time
          example: '2019-04-13T03:35:34Z'
        segmentID:
          type: string
        integrationConnectionID:
          type: string
          description: Link to v2/IntegrationConnection resource via its id
        operationType:
          allOf:
            - $ref: '#/components/schemas/OperationType'
          type: string
      required:
        - id
        - status
        - deviceType
        - updatedAt
        - integrationConnectionID
        - operationType
      description: Delivery information about a Segment to a IntegrationConnection
    v2DeliveryMultiResponse:
      type: object
      properties:
        v2/Deliveries:
          description: Array of retrieved v2/Deliveries
          type: array
          items:
            $ref: '#/components/schemas/v2DeliveryOutput'
        _pagination:
          $ref: '#/components/schemas/v2DeliveryMultiResponsePagination'
    DeliveryStatus:
      type: string
      enum:
        - FAILED
        - CANCELLED
        - PENDING
        - IN_PROGRESS
        - DELIVERED
    OperationType:
      type: string
      enum:
        - ADD
        - DELETE
    v2DestinationOutput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          format: url
          example: 'https://www.domain.com (url)'
      required:
        - id
        - name
        - logoUrl
      description: A LiveRamp partner that can receive data from LiveRamp
    v2DestinationMultiResponse:
      type: object
      properties:
        v2/Destinations:
          description: Array of retrieved v2/Destinations
          type: array
          items:
            $ref: '#/components/schemas/v2DestinationOutput'
        _pagination:
          $ref: '#/components/schemas/v2DestinationMultiResponsePagination'
    v2DestinationIntegrationOutput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          allOf:
            - $ref: '#/components/schemas/IntegrationType'
          type: string
        deviceTypes:
          items:
            allOf:
              - $ref: '#/components/schemas/DeviceType'
            type: string
          type: array
        requiredProperties:
          items:
            allOf:
              - $ref: '#/components/schemas/IntegrationProperty'
            type: object
          type: array
        oAuthEndpointID:
          description: >-
            Used when creating an OAuthConnectionAttempt. Only returned if the
            Integration requires OAuth
          type: string
        unavailableReason:
          type: string
      required:
        - id
        - name
        - description
        - type
        - deviceTypes
        - requiredProperties
      description: An outline of the required configuration to send data to a destination
    v2DestinationIntegrationMultiResponse:
      type: object
      properties:
        integrations:
          description: 'Array of retrieved v2/Destination::Integrations'
          type: array
          items:
            $ref: '#/components/schemas/v2DestinationIntegrationOutput'
        _pagination:
          $ref: '#/components/schemas/v2DestinationIntegrationMultiResponsePagination'
    IntegrationView:
      type: string
      enum:
        - STANDARD
        - STANDARD_WITH_UNAVAILABLE
    IntegrationProperty:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
        - description
    DeviceType:
      type: string
      enum:
        - PII
        - WEB
        - IOS
        - ANDROID
        - CUSTOM_ID
        - MIXED
        - OTHER
        - RAMP_ID
    IntegrationType:
      type: string
      enum:
        - ONBOARDING
        - FULFILLMENT
        - DATA_STORE
