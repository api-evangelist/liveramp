note: >-
  LiveRamp publishes no general-purpose REST client library for the Activation, AbiliTec, RampID,
  Privacy or Data Marketplace APIs — those are documented as raw HTTP. The first-party client
  code that does exist is (a) a Python client for the Clean Room API, (b) the ATS mobile SDK for
  iOS, and (c) the ATS browser library delivered from LiveRamp's own CDN. The @liveramp/* npm
  scope and com.liveramp Maven group are real and first-party but hold internal engineering
  utilities (promise helpers, Cascading/Hadoop tooling), not API clients, so they are recorded
  with official:true and api_client:false.
